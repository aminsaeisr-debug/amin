name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore seed-mas-new.jks \
            -alias seedmas \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass 'SeedMas@2026' \
            -keypass 'SeedMas@2026' \
            -dname "CN=seed-mas, OU=Dev, O=seed-mas, L=Tehran, S=Tehran, C=IR"

      - name: Convert to Base64
        run: |
          base64 -w 0 seed-mas-new.jks > keystore-base64.txt
          echo "Base64 length: $(wc -c < keystore-base64.txt) bytes"

      - name: Create info file
        run: |
          printf '========================================\n' > KEYSTORE-INFO.txt
          printf 'seed-mas - Keystore Information\n' >> KEYSTORE-INFO.txt
          printf '========================================\n\n' >> KEYSTORE-INFO.txt
          printf 'File: seed-mas-new.jks\n\n' >> KEYSTORE-INFO.txt
          printf 'Store Password: SeedMas@2026\n' >> KEYSTORE-INFO.txt
          printf 'Key Alias: seedmas\n' >> KEYSTORE-INFO.txt
          printf 'Key Password: SeedMas@2026\n\n' >> KEYSTORE-INFO.txt
          printf '========================================\n' >> KEYSTORE-INFO.txt
          printf 'GitHub Secrets (copy-paste):\n' >> KEYSTORE-INFO.txt
          printf '========================================\n\n' >> KEYSTORE-INFO.txt
          printf 'SEED_MAS_KEYSTORE_B64 = (see keystore-base64.txt)\n' >> KEYSTORE-INFO.txt
          printf 'SEED_MAS_STORE_PASSWORD = SeedMas@2026\n' >> KEYSTORE-INFO.txt
          printf 'SEED_MAS_KEY_ALIAS = seedmas\n' >> KEYSTORE-INFO.txt
          printf 'SEED_MAS_KEY_PASSWORD = SeedMas@2026\n' >> KEYSTORE-INFO.txt

      - name: Upload keystore files
        uses: actions/upload-artifact@v7
        with:
          name: seed-mas-keystore
          path: |
            seed-mas-new.jks
            keystore-base64.txt
            KEYSTORE-INFO.txt
          retention-days: 90
