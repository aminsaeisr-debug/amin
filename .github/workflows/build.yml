name: seed-mas • Build APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant"
        required: true
        default: "debug"
        type: choice
        options: [debug, release]

permissions:
  contents: read

concurrency:
  group: seed-mas-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # کمی افزایش برای اطمینان از تکمیل تست‌ها و بیلد
    steps:
      - name: Checkout
        uses: actions/checkout@v6 # v5 → v6 (Node.js 24)

      - name: Set up JDK 17
        uses: actions/setup-java@v6 # v6 → v6 (به‌روز شده به 6.1.0)
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6 # v6 (آخرین نسخه پایدار)

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          test -f settings.gradle
          test -f app/build.gradle
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/srooyesh/seedcounter/MainActivity.kt
          test -f app/src/main/java/com/srooyesh/seedcounter/CameraActivity.kt
          test -f app/src/main/java/com/srooyesh/seedcounter/NumberRecognitionEngine.kt
          test "$(find app/src/main/res/values -maxdepth 1 -name "styles.xml" | wc -l)" -eq 1
          test -f ./gradlew
          test -z "$(find . -type f \( -name "*.bat" -o -name "*.cmd" -o -name "*.ps1" \) -print -quit)"
          ./gradlew --version

      - name: Unit tests
        shell: bash
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        shell: bash
        run: ./gradlew --no-daemon assembleDebug

      - name: Prepare release signing
        id: signing
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.variant == 'release' }}
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.SEED_MAS_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SEED_MAS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SEED_MAS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SEED_MAS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Release build requires signing secrets."
            echo "Configure SEED_MAS_KEYSTORE_B64, SEED_MAS_STORE_PASSWORD, SEED_MAS_KEY_ALIAS and SEED_MAS_KEY_PASSWORD."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/seed-mas-release.keystore"
          echo "SEED_MAS_KEYSTORE_PATH=$RUNNER_TEMP/seed-mas-release.keystore" >> "$GITHUB_ENV"
          echo "SEED_MAS_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SEED_MAS_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SEED_MAS_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.variant == 'release' }}
        shell: bash
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect and verify APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release

          # استخراج نسخه از فایل build.gradle به روشی مقاوم‌تر
          VERSION_NAME=$(grep -E "^\s*versionName\s+['\"]([^'\"]+)" app/build.gradle | head -1 | sed -E "s/^\s*versionName\s+['\"]([^'\"]+).*/\1/")
          EXPECTED_CODE=$(grep -E "^\s*versionCode\s+([0-9]+)" app/build.gradle | head -1 | sed -E "s/^\s*versionCode\s+([0-9]+).*/\1/")
          [[ -n "$VERSION_NAME" && -n "$EXPECTED_CODE" ]] || { echo "Could not parse version from build.gradle"; exit 1; }

          # انتخاب فایل APK بر اساس ورودی workflow
          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.variant }}" == "debug" ]]; then
            APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
            APK_NAME="seed-mas-${VERSION_NAME}-debug.apk"
          else
            APK_SOURCE="app/build/outputs/apk/release/app-release.apk"
            APK_NAME="seed-mas-${VERSION_NAME}.apk"
          fi

          cp "$APK_SOURCE" "release/$APK_NAME"
          test "$(find release -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 1
          APK="release/$APK_NAME"

          # بررسی‌های صحت APK
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)
          [[ -n "$AAPT2" ]]
          BADGING=$("$AAPT2" dump badging "$APK")
          echo "$BADGING" | grep -F "package: name='com.srooyesh.seedcounter' versionCode='$EXPECTED_CODE' versionName='$VERSION_NAME'"
          unzip -t "$APK" >/dev/null

          # تأیید امضا فقط برای نسخه release
          if [[ "${{ inputs.variant }}" == "release" ]]; then
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
            [[ -n "$APKSIGNER" ]]
            "$APKSIGNER" verify --verbose "$APK"
          fi

          sha256sum "$APK" > release/SHA256SUMS.txt
          ls -lh release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7 # v7 (آخرین نسخه پایدار)
        with:
          name: seed-mas-apk
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30
