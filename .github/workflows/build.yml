name: seed-mas • Enterprise CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seed-mas-enterprise
  cancel-in-progress: true

jobs:
  # ==========================================
  # 🛡️ لایه اول: دروازه‌بان کیفیت (سرعت بالا)
  # ==========================================
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        
      - name: Static Analysis (Lint)
        run: ./gradlew --no-daemon lintDebug
        
      - name: Unit Tests (منطق برنامه)
        run: ./gradlew --no-daemon testDebugUnitTest

  # ==========================================
  # 📱 لایه دوم: تست روی ۳ گوشی مجازی (Matrix)
  # ==========================================
  ui-tests-matrix:
    needs: quality-gates
    runs-on: macos-14 
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # تست همزمان روی اندروید 8 (26)، اندروید 11 (30) و اندروید 14 (34)
        api-level: [26, 30, 34] 
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      
      - name: Run UI Tests on API ${{ matrix.api-level }}
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          # اجرای تست‌های ذخیره سازی و اکسل
          script: ./gradlew --no-daemon connectedDebugAndroidTest

  # ==========================================
  # 🏗️ لایه سوم: ساخت و مهر و موم فایل نهایی
  # ==========================================
  build-release-apk:
    needs: ui-tests-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      
      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK Structure
        run: |
          set -euo pipefail
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/seed-mas-final.apk
          
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)
          BADGING=$("$AAPT2" dump badging release/seed-mas-final.apk)
          echo "$BADGING" | grep -F "package: name='com.srooyesh.seedcounter'"
          
          unzip -t release/seed-mas-final.apk >/dev/null
          sha256sum release/seed-mas-final.apk > release/SHA256SUMS.txt
          ls -lh release/

      - name: Upload Secured APK
        uses: actions/upload-artifact@v4
        with:
          name: seed-mas-apk
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30
