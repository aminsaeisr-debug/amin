plugins {
    id 'com.android.application'
    // نکته: از AGP 9.x به بعد، Kotlin به‌صورت داخلی پشتیبانی می‌شود و
    // نیازی به افزودن id 'org.jetbrains.kotlin.android' نیست.
}

android {
    namespace 'com.srooyesh.seedcounter'
    compileSdk 36

    defaultConfig {
        applicationId 'com.srooyesh.seedcounter'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '4.1.2'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        stableRelease {
            def stableStore = System.getenv('SEED_MAS_KEYSTORE_PATH')
            def stableStorePassword = System.getenv('SEED_MAS_STORE_PASSWORD')
            def stableAlias = System.getenv('SEED_MAS_KEY_ALIAS')
            def stableKeyPassword = System.getenv('SEED_MAS_KEY_PASSWORD')
            if (stableStore && stableStorePassword && stableAlias && stableKeyPassword) {
                storeFile = file(stableStore)
                storePassword = stableStorePassword
                keyAlias = stableAlias
                keyPassword = stableKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // برای نسخه Production فعال شد تا حجم APK کاهش یابد و کد مبهم‌سازی شود.
            // در صورت بروز خطا در زمان اجرا، ابتدا این مقادیر را موقتاً false کنید.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.stableRelease.storeFile != null) {
                signingConfig signingConfigs.stableRelease
            }
        }
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt'
            ]
        }
    }
}

dependencies {
    // هسته و سازگاری
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Activity و Lifecycle
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'

    // CameraX (از 1.4.x به 1.6.2 ارتقا یافت؛ در صورت نیاز به تنظیمات کد، به مستندات مراجعه کنید)
    implementation 'androidx.camera:camera-core:1.6.2'
    implementation 'androidx.camera:camera-camera2:1.6.2'
    implementation 'androidx.camera:camera-lifecycle:1.6.2'
    implementation 'androidx.camera:camera-view:1.6.2'

    // ML Kit
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // تست
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
}
